<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏨 Room Booking System</h1>
            <nav>
                <a href="/" class="active">Book Room</a>
                <a href="/admin">Admin Panel</a>
            </nav>
        </header>

        <main>
            <section class="booking-form">
                <h2>Book a Room</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="room">Select Room:</label>
                        <select id="room" required>
                            <option value="">Choose a room...</option>
                            <option value="Conference Room A">Conference Room A</option>
                            <option value="Conference Room B">Conference Room B</option>
                            <option value="Meeting Room">Meeting Room</option>
                            <option value="Board Room">Board Room</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Time:</label>
                        <select id="time" required>
                            <option value="">Select time...</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="17:00">05:00 PM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="purpose">Purpose:</label>
                        <textarea id="purpose" rows="3" placeholder="Brief description of meeting purpose" required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Book Room</button>
                </form>
                <div id="message" class="message"></div>
            </section>

            <section class="available-rooms">
                <h2>Available Rooms</h2>
                <div id="availabilityList">
                    <p>Loading availability...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
